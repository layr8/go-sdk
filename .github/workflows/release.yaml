name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -count=1 -parallel=4 -v ./...

  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag is semver
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $TAG is not valid semver (expected vX.Y.Z)"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  publish-compat-image:
    needs: [test, validate-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push compat image
        run: |
          VERSION=${{ needs.validate-version.outputs.version }}
          IMAGE=ghcr.io/layr8/go-sdk/compat
          docker build \
            --build-arg SDK_VERSION=$VERSION \
            -t $IMAGE:$VERSION \
            -f compat/Dockerfile .
          docker push $IMAGE:$VERSION

  compat-gate:
    needs: [publish-compat-image, validate-version]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger compat-suite gate
        run: |
          gh api repos/layr8/compat-suite/dispatches \
            -f event_type=gate \
            -f "client_payload[sdk]=go" \
            -f "client_payload[version]=${{ needs.validate-version.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.COMPAT_GATE_PAT }}

  index-goproxy:
    needs: [test, validate-version]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Trigger GOPROXY indexing
        run: |
          GOPROXY=proxy.golang.org go list -m \
            github.com/layr8/go-sdk@${{ needs.validate-version.outputs.version }}
